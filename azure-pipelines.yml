# The pipeline of a repository of The Test Cabinet: every gate a commit has to
# pass, then for a tag the publish of the TypeScript packages to the project's
# feed, and last the push of a gated branch or tag to the GitHub mirror.
#
# Each job runs inside a CI image the superrepo builds, described under its
# ci/images/ and pushed to testcabinet.azurecr.io by its image pipeline: the checks
# job in the web image and, for a kind carrying a Rust crate, the Rust job in
# its track's image. The images are pulled through the the-test-cabinet-acr
# service connection, and each is named under resources at the commit whose
# image pipeline run built it, the `ciImageTag` the superrepo's
# ci/images/tags.yml pins, so what a gate ran inside is a fact written in the
# diff. ci/tests/test_wiring.py holds each track to its image.
#
# This repository's tests read another repository's files across a data edge
# of the kit's edge table, which no manifest names, so the checks job checks
# each out beside this one, every checkout at its name under the sources
# directory, declares each under resources and names it as one it uses, which
# scopes the job's access token to read it, and runs each step in this
# repository's checkout. A variable of the job names each data checkout to the
# tests.
#
# This repository's kind carries the `typescript` gate, so its workspace may
# name a package of the project, which installs from the project's private
# feed. Before a job's first `npm ci`, scripts/ci/npm-feed.sh writes the job's
# access token into the user's npm configuration as the credential npm
# presents to the feed, so the token reaches npm through configuration alone.
#
# This site is served by a deployment, so it builds its image once the gates
# passed, on a push to master or staging alone. The image stage builds the
# Dockerfile at the root natively on an amd64 and an arm64 agent, and
# scripts/ci/image.sh pushes each as `<name>:<commit>-<arch>`; its last job
# fuses the two with scripts/ci/manifest.sh into the multi-arch tag a
# deployment pins:
#
#   testcabinet.azurecr.io/console.testcabinet.ai:<commit>
#
# A build fetches no repository: the job's token is written as npm's
# credential for the feed by scripts/ci/npm-feed.sh, and that configuration
# is handed to the build as the secret `npmrc`, so the Dockerfile's install
# of the workspace mounts it for that RUN alone and it never enters a layer.
# Both jobs push through the the-test-cabinet-acr service connection, which
# holds AcrPush on the registry. The `build-context` gate holds the
# Dockerfile's COPY sources to .dockerignore before any of it runs.
#
# A push of a tag `v*` runs the gates too, and such a run then
# runs the publish stage, which publishes each public package of the workspace
# to the feed at the version its manifest carries, the tag's. Every repository
# is rendered the stage, and one whose kind builds no TypeScript workspace has
# nothing to publish, so its stage skips with a notice.
#
# The repository kit writes this file, so a change arrives with
# `scripts/repos/render.py --update` run from the superrepo rather than by
# hand here.
#
# `master` and `staging` take pull requests alone, and a branch policy runs
# this pipeline as their build validation; `nightly` takes pushes. A push to
# any of the three runs the pipeline.
trigger:
  batch: true
  branches:
    include:
      - master
      - staging
      - nightly
  tags:
    include:
      - v*

resources:
  # Each repository the checks job checks out beside this one, so the
  # job's access token may read it.
  repositories:
    - repository: test-suites
      type: git
      name: the-test-cabinet/test-suites
      ref: master
  # The images the tracks run in, built by the superrepo's image pipeline
  # and pulled through the service connection the-test-cabinet-acr before a
  # job starts. Each tag is the commit whose image pipeline run built the
  # image, which the superrepo's ci/images/tags.yml pins; a bump arrives
  # with `scripts/repos/render.py --update`.
  containers:
    - container: web
      image: testcabinet.azurecr.io/ubuntu-the-test-cabinet-web-cicd:af509db605fd49250ddd49aece1177ab9f5d69d1
      endpoint: the-test-cabinet-acr

pool:
  vmImage: ubuntu-24.04

variables:
  ciCache: $(Pipeline.Workspace)/ci-cache

stages:
  - stage: gates
    displayName: Gates
    jobs:
      - job: checks
        displayName: Checks
        timeoutInMinutes: 30
        container: web
        uses:
          repositories:
            - test-suites
        variables:
          TCAB_DEFINITIONS_ROOT: $(Build.SourcesDirectory)/test-suites
        steps:
          # This repository beside each repository its tests read across a data
          # edge, every one at its name under the sources directory.
          - checkout: self
            path: s/console.testcabinet.ai
            fetchDepth: 1
            clean: true
          - checkout: test-suites
            path: s/test-suites
            fetchDepth: 1
            clean: true
          - script: scripts/ci/npm-feed.sh https://pkgs.dev.azure.com/genyume/the-test-cabinet/_packaging/the-test-cabinet/npm/registry/
            displayName: Authenticate npm to the package feed
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          - script: npm ci
            displayName: Install the npm workspace
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
          - script: pre-commit install-hooks
            displayName: Install the hook environments
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
          - script: echo "##vso[task.setvariable variable=checksReady]true"
            displayName: Ready to run the checks
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
          - script: uv run --quiet --project ci gate run dependency-edges
            displayName: dependency edges
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-added-large-files --all-files --show-diff-on-failure
            displayName: Check for added large files
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-case-conflict --all-files --show-diff-on-failure
            displayName: Check for case conflicts
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-executables-have-shebangs --all-files --show-diff-on-failure
            displayName: Check that executables have shebangs
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-illegal-windows-names --all-files --show-diff-on-failure
            displayName: Check for illegal Windows names
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-json --all-files --show-diff-on-failure
            displayName: Check JSON
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-merge-conflict --all-files --show-diff-on-failure
            displayName: Check for merge conflicts
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run end-of-file-fixer --all-files --show-diff-on-failure
            displayName: Newline at end of file
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-shebang-scripts-are-executable --all-files --show-diff-on-failure
            displayName: Check that shebang scripts are executable
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-symlinks --all-files --show-diff-on-failure
            displayName: Check for broken symlinks
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-toml --all-files --show-diff-on-failure
            displayName: Check TOML
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-vcs-permalinks --all-files --show-diff-on-failure
            displayName: Check VCS permalinks
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-xml --all-files --show-diff-on-failure
            displayName: Check XML
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run check-yaml --all-files --show-diff-on-failure
            displayName: Check YAML
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: pre-commit run shellcheck --all-files --show-diff-on-failure
            displayName: shellcheck
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: uv run --quiet --project ci gate run no-nul-bytes
            displayName: NUL bytes in text files
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: uv run --quiet --project ci gate run shell-tests
            displayName: shell tests
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: uv run --quiet --project ci gate run markdownlint
            displayName: markdownlint
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: uv run --quiet --project ci gate run cspell
            displayName: cspell
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: uv run --quiet --project ci gate run format
            displayName: prettier (--check)
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: uv run --quiet --project ci gate run python-lint
            displayName: ruff (check, format)
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: uv run --quiet --project ci gate run build-context
            displayName: Dockerfile build context
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: uv run --quiet --project ci gate run ci-tests
            displayName: ci tests (pytest)
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
            env:
              CI_GATE_ARTIFACTS: target/gate-artifacts/ci-tests
          - task: PublishTestResults@2
            displayName: Publish the ci test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Build.SourcesDirectory)/console.testcabinet.ai/target/gate-artifacts/ci-tests/junit.xml
              testRunTitle: ci tests
              failTaskOnMissingResultsFile: false
          - script: uv run --quiet --project ci gate run typescript
            displayName: TypeScript (npm ci, build, type-check, test)
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
            env:
              CI_GATE_ARTIFACTS: target/gate-artifacts/typescript
          - task: PublishTestResults@2
            displayName: Publish the TypeScript test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Build.SourcesDirectory)/console.testcabinet.ai/target/gate-artifacts/typescript/junit.xml
              testRunTitle: TypeScript tests
              failTaskOnMissingResultsFile: false
          - script: uv run --quiet --project ci gate run web-lint
            displayName: web-lint (this repository's own gate)
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')
          - script: uv run --quiet --project ci gate run web-browser-test
            displayName: web-browser-test (this repository's own gate)
            workingDirectory: $(Build.SourcesDirectory)/console.testcabinet.ai
            condition: eq(variables['checksReady'], 'true')

  # The repository's image, after every gate passed, on master and staging:
  # one job per architecture, then the multi-arch tag. A tag's run builds
  # none, and the publish and mirror stages do not wait on the image stage.
  - stage: image
    displayName: Image
    dependsOn: gates
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/staging'))
    jobs:
      - job: image_amd64
        displayName: Image (amd64)
        timeoutInMinutes: 120
        pool:
          vmImage: ubuntu-24.04
        steps:
          - checkout: self
            fetchDepth: 1
            clean: true
          - script: |
              sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
              df -h /
            displayName: Free the host's disk of the software the job never uses
          - script: scripts/ci/npm-feed.sh https://pkgs.dev.azure.com/genyume/the-test-cabinet/_packaging/the-test-cabinet/npm/registry/
            displayName: Authenticate npm to the package feed
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          - task: Docker@2
            displayName: Log in to the registry
            retryCountOnTaskFailure: 2
            inputs:
              command: login
              containerRegistry: the-test-cabinet-acr
          - script: scripts/ci/image.sh console.testcabinet.ai "$(Build.SourceVersion)"
            displayName: Build and push the image (amd64)
      - job: image_arm64
        displayName: Image (arm64)
        timeoutInMinutes: 120
        pool:
          name: pool-dev-linux-arm64-wus3-4c-eph-01
        steps:
          - checkout: self
            fetchDepth: 1
            clean: true
          - script: scripts/ci/npm-feed.sh https://pkgs.dev.azure.com/genyume/the-test-cabinet/_packaging/the-test-cabinet/npm/registry/
            displayName: Authenticate npm to the package feed
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          - task: Docker@2
            displayName: Log in to the registry
            retryCountOnTaskFailure: 2
            inputs:
              command: login
              containerRegistry: the-test-cabinet-acr
          - script: scripts/ci/image.sh console.testcabinet.ai "$(Build.SourceVersion)"
            displayName: Build and push the image (arm64)
      - job: image_manifest
        displayName: "Image: the multi-arch tag"
        dependsOn:
          - image_amd64
          - image_arm64
        steps:
          - checkout: self
            fetchDepth: 1
            clean: true
          - task: Docker@2
            displayName: Log in to the registry
            retryCountOnTaskFailure: 2
            inputs:
              command: login
              containerRegistry: the-test-cabinet-acr
          - script: scripts/ci/manifest.sh "$(Build.SourceVersion)" console.testcabinet.ai
            displayName: Fuse the architectures
            retryCountOnTaskFailure: 2

  # A tag's run publishes here, after every gate passed: each package of the
  # npm workspace whose manifest is public is published to the project's feed
  # at the version its manifest carries, which has to be the tag's. The script
  # authenticates npm with the job's access token, so no secret is stored for
  # it, and builds the workspace in the run, since a repository commits no
  # built output. A repository with no workspace, or none public, skips with a
  # notice, and a workspace no `typescript` gate of the repository builds is
  # refused.
  - stage: publish
    displayName: Publish
    dependsOn: gates
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      - job: packages
        displayName: Publish the TypeScript packages
        timeoutInMinutes: 30
        container: web
        steps:
          - checkout: self
            fetchDepth: 1
            clean: true
          - script: scripts/ci/publish-packages.sh . https://pkgs.dev.azure.com/genyume/the-test-cabinet/_packaging/the-test-cabinet/npm/registry/ $(Build.SourceBranch)
            displayName: Publish the packages to the feed
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  # The mirror on GitHub is the public source every manifest names, and only
  # this stage writes to it, so it holds gated commits and nothing else. Each
  # of master, staging, nightly is pushed to the branch of its name once
  # every gate passed, and a tag once its packages are published.
  # scripts/ci/mirror.sh refuses a push that would not move the mirror
  # forward; queue a run with the variable `mirrorAllowRewrite` set to `true`
  # to push over it anyway. The deploy key is the secure file
  # `github-mirror-key-console.testcabinet.ai`, with write access to this mirror alone, since GitHub
  # refuses one key on two repositories.
  - stage: mirror
    displayName: Mirror
    dependsOn:
      - gates
      - publish
    condition: >-
      and(eq(dependencies.gates.result, 'Succeeded'),
      in(dependencies.publish.result, 'Succeeded', 'Skipped'),
      or(in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/staging', 'refs/heads/nightly'),
      startsWith(variables['Build.SourceBranch'], 'refs/tags/v')))
    jobs:
      - job: github
        displayName: Push to GitHub
        timeoutInMinutes: 10
        steps:
          # GitHub refuses a push from a shallow clone, a branch carries its
          # tags, and the guard needs the mirror's head in the local history.
          - checkout: self
            fetchDepth: 0
            fetchTags: true
            clean: true
          - task: DownloadSecureFile@1
            name: mirrorKey
            displayName: Fetch the mirror's deploy key
            inputs:
              secureFile: github-mirror-key-console.testcabinet.ai
          - script: >-
              scripts/ci/mirror.sh --url 'https://github.com/TheClockwyrks/console.testcabinet.ai'
              "$(mirrorKey.secureFilePath)" "$(Build.SourceBranch)"
            displayName: Push to the GitHub mirror
            env:
              MIRROR_ALLOW_REWRITE: $(mirrorAllowRewrite)
